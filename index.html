<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hundelog</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20303A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20303A;
    --ink-soft:#425362;
    --paper:#E9E2CF;
    --card:#FBF7EC;
    --card-line:rgba(32,48,58,0.10);
    --brass:#C79A3E;
    --brass-deep:#9C7526;
    --forest:#3F6B4A;
    --forest-soft:#E1EBE0;
    --rust:#A6472F;
    --rust-soft:#F3E1DA;
    --shadow: 0 2px 6px rgba(32,48,58,0.10), 0 1px 0 rgba(32,48,58,0.04);
    --radius: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;}
  body{
    min-height:100vh;
    display:flex; justify-content:center;
  }
  .app{
    width:100%; max-width:480px; min-height:100vh;
    display:flex; flex-direction:column;
    background:var(--paper);
    position:relative;
  }
  /* subtle canvas texture */
  .app::before{
    content:''; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(rgba(32,48,58,0.035) 1px, transparent 1px);
    background-size: 14px 14px;
    z-index:0;
  }

  header.topbar{
    position:relative; z-index:1;
    padding: calc(env(safe-area-inset-top,0px) + 18px) 20px 16px;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 4px solid var(--brass);
    display:flex; align-items:center; gap:12px;
  }
  header.topbar .paw{ width:34px; height:34px; flex:none; color:var(--brass); }
  header.topbar h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:22px; letter-spacing:.02em; margin:0;
    text-transform:uppercase;
  }
  header.topbar .sub{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:#C9BFA6; margin-top:2px;
  }

  main#view{
    flex:1; z-index:1; position:relative;
    padding: 18px 16px 90px;
    overflow-y:auto;
  }

  nav.tabbar{
    position:sticky; bottom:0; z-index:2;
    display:flex; background:var(--ink);
    padding: 6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:#9AABB6;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    border-radius:12px; transition: color .15s, background .15s;
  }
  nav.tabbar button svg{ width:20px; height:20px; }
  nav.tabbar button.active{ color:var(--brass); background:rgba(199,154,62,0.12); }

  h2.section-title{
    font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:700; margin: 4px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  h2.section-title .count{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    color:var(--ink-soft); background:var(--card); padding:2px 8px; border-radius:20px;
    border:1px solid var(--card-line);
  }

  .empty{
    background:var(--card); border:1px dashed var(--brass); border-radius:var(--radius);
    padding:22px 18px; text-align:center; color:var(--ink-soft); font-size:14px; line-height:1.5;
  }
  .empty strong{ display:block; color:var(--ink); font-family:'Baloo 2',sans-serif; font-size:16px; margin-bottom:4px; }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--card-line); padding:16px; margin-bottom:14px;
  }
  .card + .card{ margin-top:0; }

  /* dog-tag chip: exercise checklist item */
  .tag-item{
    position:relative; display:flex; align-items:center; gap:10px;
    background:var(--card); border-radius:14px; padding:12px 14px 12px 34px;
    margin-bottom:9px; border:1px solid var(--card-line);
    box-shadow: inset 0 0 0 1px rgba(32,48,58,0.02);
    cursor:pointer; user-select:none; transition: background .2s, border-color .2s;
  }
  .tag-item::before{
    content:''; position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%; border:2px solid var(--brass-deep); background:var(--paper);
  }
  .tag-item .name{ font-weight:600; font-size:14.5px; flex:1; }
  .tag-item .note{ font-size:12px; color:var(--ink-soft); display:block; font-weight:400; margin-top:1px; }
  .tag-item.has-img{ padding-left:56px; }
  .tag-item .thumb{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:36px; height:36px; border-radius:9px; object-fit:cover; border:2px solid var(--brass-deep);
  }
  .tag-item .stamp{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11px; color:var(--forest);
    opacity:0; transform: scale(2) rotate(-18deg); transition: all .25s cubic-bezier(.34,1.56,.64,1);
    border:2px solid var(--forest); border-radius:8px; padding:1px 6px; text-transform:uppercase;
    letter-spacing:.03em;
  }
  .tag-item.done{ background:var(--forest-soft); border-color:rgba(63,107,74,0.25); }
  .tag-item.done::before{ border-color:var(--forest); background:var(--forest); }
  .tag-item.done .stamp{ opacity:1; transform: scale(1) rotate(-8deg); }
  .tag-item.done .name{ color:var(--forest); }

  .session-card .time-badge{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;
    background:var(--ink); color:var(--brass); padding:4px 10px; border-radius:8px; display:inline-block;
    margin-bottom:10px;
  }
  .session-card .progress{
    font-size:12px; color:var(--ink-soft); margin: 8px 0 4px; font-weight:500;
  }
  .session-card .progress-bar{
    height:6px; background:rgba(32,48,58,0.08); border-radius:6px; overflow:hidden; margin-bottom:12px;
  }
  .session-card .progress-fill{ height:100%; background:var(--forest); transition:width .3s; }

  textarea, input[type=text], input[type=date], input[type=time]{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px;
    border-radius:10px; border:1px solid var(--card-line); background:var(--paper); color:var(--ink);
  }
  textarea{ min-height:64px; resize:vertical; }
  label.field-label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin: 12px 0 5px; text-transform:uppercase; letter-spacing:.03em; }

  .btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; letter-spacing:.01em;
    border:none; border-radius:12px; padding:12px 16px; cursor:pointer; width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .1s, filter .15s;
  }
  .btn:active{ transform: scale(.98); }
  .btn-primary{ background:var(--brass); color:var(--ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--card-line); }
  .btn-danger{ background:var(--rust-soft); color:var(--rust); }
  .btn-small{ padding:8px 12px; font-size:12.5px; width:auto; }
  .row-buttons{ display:flex; gap:8px; margin-top:12px; }
  .row-buttons .btn{ flex:1; }

  .chip-select{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;
  }
  .chip-select .chip{
    font-size:13px; font-weight:600; padding:8px 12px; border-radius:20px;
    border:1.5px solid var(--card-line); background:var(--card); cursor:pointer; user-select:none;
  }
  .chip-select .chip.selected{ background:var(--brass); border-color:var(--brass-deep); color:var(--ink); }
  .chip-select .chip{ display:inline-flex; align-items:center; }
  .chip-select .chip img.chip-thumb{ width:16px; height:16px; border-radius:4px; object-fit:cover; margin-right:6px; }

  .quick-log-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--card); border:1.5px dashed var(--brass); border-radius:14px;
    padding:12px; margin-bottom:14px; cursor:pointer; font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:14px; color:var(--brass-deep);
  }

  .lib-item{
    display:flex; align-items:flex-start; gap:10px; background:var(--card);
    border-radius:14px; padding:12px 14px; margin-bottom:9px; border:1px solid var(--card-line);
  }
  .lib-item .lib-main{ flex:1; }
  .lib-item .lib-main .name{ font-weight:700; font-size:14.5px; }
  .lib-item .lib-main .note{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .lib-item button{ background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:4px; }
  .lib-item button:hover{ color:var(--rust); }
  .lib-photo-slot{ position:relative; flex:none; }
  .lib-photo{ width:48px; height:48px; border-radius:10px; object-fit:cover; border:1px solid var(--card-line); display:block; cursor:pointer; }
  .lib-photo-btn{
    width:48px; height:48px; border-radius:10px; flex:none; border:1.5px dashed var(--brass);
    background:var(--paper); color:var(--brass-deep); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:20px; font-weight:700;
  }
  .lib-photo-remove{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--rust); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .new-photo-preview{ width:64px; height:64px; border-radius:12px; object-fit:cover; border:1px solid var(--card-line); margin-top:4px; }

  .cat-pill{
    display:inline-block; background:var(--paper); color:var(--brass-deep); border:1px solid var(--brass);
    border-radius:20px; padding:2px 9px; font-size:11px; font-weight:700; margin:2px 4px 2px 0;
  }
  .cat-edit-btn{
    background:none; border:none; color:var(--brass-deep); font-size:11px; font-weight:700;
    cursor:pointer; padding:2px 4px; width:auto !important;
  }
  .lib-cats-row{ margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:2px; }
  .fav-star{
    background:none; border:none; font-size:19px; line-height:1; color:rgba(32,48,58,0.18);
    cursor:pointer; padding:4px; width:auto !important; flex:none;
  }
  .fav-star.active{ color:var(--brass); }
  .lib-icon-btn{
    background:none; border:none; color:rgba(32,48,58,0.32); cursor:pointer;
    padding:4px; width:auto !important; flex:none; display:flex; align-items:center;
  }
  .lib-icon-btn.active{ color:var(--ink-soft); }
  .lib-item.archived{ opacity:0.6; }

  .upcoming-row{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-line);
    border-radius:14px; padding:12px 14px; margin-bottom:9px; cursor:pointer;
  }
  .upcoming-row .date-block{
    font-family:'JetBrains Mono',monospace; text-align:center; background:var(--ink); color:var(--brass);
    border-radius:8px; padding:6px 8px; font-size:11px; font-weight:600; line-height:1.2; flex:none; min-width:52px;
  }
  .upcoming-row .info{ flex:1; }
  .upcoming-row .info .t{ font-weight:600; font-size:14px; }
  .upcoming-row .info .ex{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .upcoming-row.missed{ border-color:rgba(166,71,47,0.35); }
  .upcoming-row.missed .date-block{ background:var(--rust); color:#fff; }

  .log-entry{
    background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; border:1px solid var(--card-line);
  }
  .log-entry .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .log-entry .head .d{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .log-entry .exlist{ font-size:13px; color:var(--ink); margin-bottom:6px; }
  .log-entry .exlist span.pill{
    display:inline-block; background:var(--forest-soft); color:var(--forest); border-radius:10px;
    padding:2px 8px; font-size:11.5px; font-weight:600; margin:2px 3px 0 0;
  }
  .log-entry .notes{ font-size:13px; color:var(--ink-soft); font-style:italic; border-left:3px solid var(--brass); padding-left:8px; }
  .entry-actions{ display:flex; gap:2px; flex:none; }
  .entry-action-btn{
    background:none; border:none; font-size:14px; cursor:pointer; padding:4px 6px;
    line-height:1; color:var(--ink-soft); border-radius:6px;
  }
  .entry-action-btn:hover{ background:rgba(32,48,58,0.06); color:var(--ink); }
  .entry-action-btn.danger:hover{ color:var(--rust); }

  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px; font-size:13px;
    font-weight:600; box-shadow:var(--shadow); opacity:0; transition:opacity .2s, transform .2s; z-index:10;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::placeholder{ color:#9AA6AD; }
  .storage-note{ font-size:11px; color:var(--rust); background:var(--rust-soft); border-radius:8px; padding:6px 10px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="paw" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.5" rx="6" ry="5"/><ellipse cx="5.2" cy="9" rx="2.3" ry="3"/><ellipse cx="18.8" cy="9" rx="2.3" ry="3"/><ellipse cx="8.7" cy="4.8" rx="2" ry="2.6"/><ellipse cx="15.3" cy="4.8" rx="2" ry="2.6"/></svg>
    <div>
      <h1>Hundelog</h1>
      <div class="sub" id="todayDate"></div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      I dag
    </button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      Planlæg
    </button>
    <button data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M8 8h6"/></svg>
      Øvelser
    </button>
    <button data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Log
    </button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------- storage layer ----------
   1) window.storage — used automatically when running inside a Claude.ai artifact
   2) localStorage — used automatically when opened as a standalone file in a normal browser
      (e.g. saved to a phone and opened directly), so data still persists between visits
   3) in-memory — last-resort fallback if neither is available (e.g. private browsing) */
const memoryStore = {};
let usingFallback = false; // true only if we've fallen all the way back to in-memory (data won't survive a reload)
const LOCAL_PREFIX = 'traenerlog:'; // kept as-is on purpose: this must match existing saved data on your phone, even though the app is now called Hundelog

async function storeGet(key){
  if(window.storage){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LOCAL_PREFIX + key);
    return raw !== null ? JSON.parse(raw) : null;
  } catch(e){
    usingFallback = true;
    return memoryStore[key] !== undefined ? memoryStore[key] : null;
  }
}
async function storeSet(key, value){
  if(window.storage){
    try{ await window.storage.set(key, JSON.stringify(value), false); return; }
    catch(e){ /* fall through to localStorage/memory */ }
  }
  try{
    localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value));
    return;
  } catch(e){
    usingFallback = true;
    memoryStore[key] = value;
  }
}

/* ---------- state ---------- */
let exercises = [];   // {id, name, note, image, categories, favorite}
let sessions = [];    // {id, date, time, exerciseIds:[], doneIds:[], completed, notes, completedAt}
let activities = [];  // {id, date, time, type, note, image, createdAt} — non-training dog activities
let diaryEntries = []; // {id, date, time, text, createdAt} — free-text observations
let healthEntries = []; // {id, date, time, type, weightKg, note, createdAt}
let activeTab = 'today';
let planEditingId = null; // session currently being edited in Plan tab, or null for "new"
let quickEntryOpen = false;
let quickEntryKind = null; // 'training' | 'activity' | 'diary' | 'health'
let quickLogSelected = [];
let quickActivityPhoto = null; // temp photo for the activity quick-entry form
let quickEntryDate = null; // selected date for the entry being logged (set when the form opens)
let quickEntryTime = null; // selected time for the entry being logged (set when the form opens)
let newExercisePhoto = null; // data URL for the "add exercise" form, before saving
let photoTargetExerciseId = null; // which existing exercise the hidden file input is currently targeting
let logPeriod = 'week'; // 'week' | 'month' | 'year' — controls the Log tab's visual summary
let monthOffset = 0; // 0 = current month, -1 = previous month, etc.
let yearOffset = 0;  // 0 = current year, -1 = previous year, etc.
let logTypeFilter = 'all'; // 'all' | 'training' | 'activity' | 'diary' | 'health' — filters the combined Log timeline
let logSearchTerm = ''; // free-text search across all logged notes
let editingLogEntry = null; // { kind, id } of the entry currently being edited in the Log tab, or null
let editingActivityPhoto = undefined; // temp photo state while editing an activity entry (undefined = not editing)
let libraryCategoryFilter = null; // selected theme filter in the Library tab, null = show all
let librarySearch = '';           // search text in the Library tab
let libEditingCatsId = null;      // id of the exercise whose theme editor is currently open
let libEditingNoteId = null;      // id of the exercise whose note editor is currently open
let libEditingNameId = null;      // id of the exercise whose name editor is currently open
let showArchivedExercises = false; // whether hidden/archived exercises are shown in the Library results
let libDetailsOpenId = null;       // id of the exercise whose extra-details panel is expanded
let libRewardFilter = null;        // selected reward-type filter in the Library tab
let libDifficultyFilter = null;    // selected difficulty filter in the Library tab
let libForloebFilter = null;       // selected forløb filter in the Library tab
let manageForloebOpen = false;     // whether the "manage forløb" panel is expanded
let renamingForloebName = null;    // forløb currently being renamed, or null
let exercisePickerFiltersOpen = false; // shared toggle for the compact filter panel in Plan/Today exercise pickers
let planSelectedExerciseIds = [];  // module-tracked selection for the Plan form (survives filter-triggered refreshes)
let planFormInitializedFor = undefined; // which planEditingId (or 'new') planSelectedExerciseIds was last set up for
let randomExerciseId = null;      // id of the currently shown random-exercise suggestion, or null
let pendingPlanExerciseId = null; // exercise to pre-select next time the new-session Plan form renders
let manageCategoriesOpen = false; // whether the "manage themes" panel is expanded in the Library tab
let deletedCategoryNames = [];    // lowercased default-suggestion names the user has explicitly removed
let deletedRewardTypeNames = [];  // lowercased default reward-type names the user has explicitly removed
let manageRewardsOpen = false;    // whether the "manage reward types" panel is expanded

const DEFAULT_ACTIVITY_TYPES = ['Børstet','Hundeskov','Legeaftale','Badet','Dyrlæge','Klippet negle'];
function getAllActivityTypes(){
  const set = new Set(DEFAULT_ACTIVITY_TYPES);
  activities.forEach(a => a.type && set.add(a.type));
  return Array.from(set).sort((a,b)=> a.localeCompare(b,'da'));
}
const DEFAULT_HEALTH_TYPES = ['Vægt','Dyrlægebesøg','Vaccination','Klippet negle','Andet'];
function getAllHealthTypes(){
  const set = new Set(DEFAULT_HEALTH_TYPES);
  healthEntries.forEach(h => h.type && set.add(h.type));
  return Array.from(set).sort((a,b)=> a.localeCompare(b,'da'));
}
function singleSelectPickerHtml(containerId, selectedValue, options, placeholder){
  const extra = (selectedValue && !options.includes(selectedValue)) ? [selectedValue] : [];
  const all = [...options, ...extra];
  return `<div class="chip-select" id="${containerId}" data-mode="single">
    ${all.map(t=>`<div class="chip ${t===selectedValue?'selected':''}" data-type="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-top:6px;">
    <input type="text" class="type-custom-input" data-target="${containerId}" placeholder="${placeholder}">
    <button class="btn btn-ghost btn-small type-custom-add" data-target="${containerId}" style="width:auto;white-space:nowrap;">Tilføj</button>
  </div>`;
}
function activityTypePickerHtml(containerId, selectedType){
  return singleSelectPickerHtml(containerId, selectedType, getAllActivityTypes(), 'Skriv ny aktivitetstype...');
}
function healthTypePickerHtml(containerId, selectedType){
  return singleSelectPickerHtml(containerId, selectedType, getAllHealthTypes(), 'Skriv ny type...');
}
function getAllForloeb(){
  const set = new Set();
  exercises.forEach(ex => { if(ex.forloeb) set.add(ex.forloeb); });
  return Array.from(set).sort((a,b)=> a.localeCompare(b,'da'));
}
function forloebPickerHtml(containerId, selected){
  return singleSelectPickerHtml(containerId, selected, getAllForloeb(), 'Skriv navn på forløb...');
}
const DEFAULT_STATUS_OPTIONS = ['Ikke startet','I gang','Kan hjemme','Kan ude'];
function statusPickerHtml(containerId, selected){
  return singleSelectPickerHtml(containerId, selected, DEFAULT_STATUS_OPTIONS, 'Skriv ny status...');
}
const DEFAULT_PRIORITY_OPTIONS = ['Høj','Mellem','Lav'];
function priorityPickerHtml(containerId, selected){
  return singleSelectPickerHtml(containerId, selected, DEFAULT_PRIORITY_OPTIONS, 'Skriv ny prioritet...');
}
function difficultyPickerHtml(containerId, selected){
  const vals = ['1','2','3','4','5'];
  return `<div class="chip-select" id="${containerId}" data-mode="single">
    ${vals.map(v=>`<div class="chip ${String(selected)===v?'selected':''}" data-type="${v}">${v}</div>`).join('')}
  </div>`;
}
function lastTrainedDate(exId){
  const dates = sessions.filter(s => s.completed && s.doneIds.includes(exId)).map(s => s.date);
  if(dates.length === 0) return null;
  return dates.sort().slice(-1)[0];
}

async function seedExercisesFromExcelImport(){
  const alreadySeeded = await storeGet('seed_toller_excel_v1');
  if(alreadySeeded) return;
  const existingNames = new Set(exercises.map(ex => ex.name.trim().toLowerCase()));
  let added = 0;
  SEED_EXERCISES_TOLLER.forEach(item => {
    if(existingNames.has(item.name.trim().toLowerCase())) return; // don't duplicate if it already exists
    exercises.push({
      id: uid(),
      name: item.name,
      note: item.note || '',
      image: null,
      categories: item.categories || [],
      favorite: false,
      archived: false,
      forloeb: item.forloeb || null,
      difficulty: item.difficulty || null,
      rewardTypes: item.rewardTypes || [],
      status: item.status || null,
      priority: item.priority || null
    });
    added++;
  });
  if(added > 0) await saveExercises();
  await storeSet('seed_toller_excel_v1', true);
}

async function updateExercisesFromExcelImportV2(){
  const alreadyUpdated = await storeGet('seed_toller_excel_v2');
  if(alreadyUpdated) return;
  const byName = new Map(exercises.map(ex => [ex.name.trim().toLowerCase(), ex]));
  let addedCount = 0, updatedCount = 0;
  SEED_EXERCISES_TOLLER_V2.forEach(item => {
    const key = item.name.trim().toLowerCase();
    const existing = byName.get(key);
    if(existing){
      // Sync content fields from the sheet, but never touch personal additions
      // (image, favorite, archived) and never blank out a value the user already
      // set in the app just because the sheet cell is empty.
      existing.note = item.note || existing.note;
      existing.categories = (item.categories && item.categories.length) ? item.categories : existing.categories;
      existing.forloeb = item.forloeb || existing.forloeb;
      existing.status = item.status || existing.status;
      existing.priority = item.priority || existing.priority;
      if(item.difficulty !== null && item.difficulty !== undefined) existing.difficulty = item.difficulty;
      if(item.rewardTypes && item.rewardTypes.length) existing.rewardTypes = item.rewardTypes;
      updatedCount++;
    } else {
      exercises.push({
        id: uid(),
        name: item.name,
        note: item.note || '',
        image: null,
        categories: item.categories || [],
        favorite: false,
        archived: false,
        forloeb: item.forloeb || null,
        difficulty: item.difficulty || null,
        rewardTypes: item.rewardTypes || [],
        status: item.status || null,
        priority: item.priority || null
      });
      addedCount++;
    }
  });
  if(addedCount > 0 || updatedCount > 0) await saveExercises();
  await storeSet('seed_toller_excel_v2', true);
}

function bindActivityTypePickerEvents(scopeEl){
  const selectOnly = (container, chip) => {
    container.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
    chip.classList.add('selected');
  };
  scopeEl.querySelectorAll('.chip-select[data-mode="single"] .chip[data-type]').forEach(chip=>{
    chip.addEventListener('click', ()=> selectOnly(chip.closest('.chip-select'), chip));
  });
  scopeEl.querySelectorAll('.type-custom-add').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const targetId = btn.dataset.target;
      const input = scopeEl.querySelector(`.type-custom-input[data-target="${targetId}"]`);
      const val = input.value.trim();
      if(!val) return;
      const container = document.getElementById(targetId);
      const existing = Array.from(container.querySelectorAll('.chip')).find(c => c.dataset.type.toLowerCase() === val.toLowerCase());
      if(existing){

function resizeImageFile(file, maxDim=480, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Kunne ikke læse billedet'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Kunne ikke læse filen'));
    reader.readAsDataURL(file);
  });
}

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const currentTimeStr = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayNames = ['søn','man','tirs','ons','tors','fre','lør'];
const monNames = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
function fmtDateShort(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return { dow: dayNames[dt.getDay()], dm: `${d}. ${monNames[m-1]}` };
}
function fmtDateLong(dateStr){
  const {dow, dm} = fmtDateShort(dateStr);
  return `${dow} ${dm}`;
}
function addDays(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function formatDDMMYYYY(isoDateStr){
  const [y,m,d] = isoDateStr.split('-');
  return `${d}/${m}/${y}`;
}

function showToast(msg){
  const t = document.getElementById('toast');

  t.classList.add('show');
  clearTimeout(t._h);

}

function renderSessionCard(s){
  const total = s.exerciseIds.length;
  const done = s.doneIds.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const exHtml = s.exerciseIds.map(id => {
    const ex = exerciseById(id);
    if(!ex) return '';
    const isDone = s.doneIds.includes(id);
    return `<div class="tag-item ${isDone?'done':''} ${ex.image?'has-img':''}" data-session="${s.id}" data-ex="${id}">
      ${ex.image? `<img class="thumb" src="${ex.image}">` : ''}
      <div style="flex:1">
        <span class="name">${escapeHtml(ex.name)}</span>
        ${ex.note ? `<span class="note">${escapeHtml(ex.note)}</span>` : ''}
      </div>
      <span class="stamp">Gjort</span>
    </div>`;
  }).join('');

  const notesBlock = s.completed
    ? `<label class="field-label">Noter fra træningen</label>
       <textarea data-session-notes="${s.id}" placeholder="Skriv en note om hvordan det gik...">${escapeHtml(s.notes||'')}</textarea>
       <div class="row-buttons"><button class="btn btn-ghost" data-save-notes="${s.id}">Gem note</button></div>`
    : `<div class="row-buttons">
         <button class="btn btn-primary" data-finish="${s.id}">Afslut træning</button>
       </div>`;

  return `<div class="card session-card">
    <span class="time-badge">${s.time}</span>
    ${s.completed ? '<span class="time-badge" style="background:var(--forest);color:#fff;margin-left:6px;">Gennemført</span>' : ''}
    ${exHtml || '<div class="empty">Ingen øvelser valgt til denne træning.</div>'}
    ${total ? `<div class="progress">${done} af ${total} øvelser</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
    ${notesBlock}
  </div>`;
}

  bindQuickChipClicks();
  bindQuickPickerFilterChips();
  applyQuickExerciseSearch();
  const quickExerciseSearch = view.querySelector('#quickExerciseSearch');
  if(quickExerciseSearch){
    quickExerciseSearch.addEventListener('input', applyQuickExerciseSearch);
  }
  const quickToggleFilters = view.querySelector('#quickToggleFilters');
  if(quickToggleFilters){
    quickToggleFilters.addEventListener('click', ()=>{
      exercisePickerFiltersOpen = !exercisePickerFiltersOpen;
      refreshQuickChipsUI();
    });
  }

  const quickEntrySubmit = view.querySelector('#quickEntrySubmit');
  if(quickEntrySubmit){
    quickEntrySubmit.addEventListener('click', async ()=>{
      const date = quickEntryDate || todayStr();
      const time = quickEntryTime || currentTimeStr();
      if(!date || !time){ showToast('Vælg dato og tidspunkt'); return; }

      if(quickEntryKind === 'training'){
        if(quickLogSelected.length === 0){ showToast('Vælg mindst én øvelse'); return; }
        const note = view.querySelector('#quickNote').value.trim();
        sessions.push({
          id: uid(), date, time,
          exerciseIds: [...quickLogSelected], doneIds: [...quickLogSelected],
          completed: true, notes: note, completedAt: Date.now()
        });
        await saveSessions();
        showToast('Træning logget 🐾');
      } else if(quickEntryKind === 'activity'){
        const selectedChip = view.querySelector('#quickActivityType .chip.selected');
        if(!selectedChip){ showToast('Vælg en aktivitetstype'); return; }
        const note = view.querySelector('#quickActivityNote').value.trim();
        activities.push({
          id: uid(), date, time,
          type: selectedChip.dataset.type, note, image: quickActivityPhoto || null, createdAt: Date.now()
        });
        await saveActivities();
        quickActivityPhoto = null;
        showToast('Aktivitet logget 🐾');
      } else if(quickEntryKind === 'diary'){
        const text = view.querySelector('#quickDiaryText').value.trim();
        if(!text){ showToast('Skriv en note'); return; }
        diaryEntries.push({ id: uid(), date, time, text, createdAt: Date.now() });
        await saveDiary();
        showToast('Note gemt 📝');
      } else if(quickEntryKind === 'health'){
        const selectedChip = view.querySelector('#quickHealthType .chip.selected');
        if(!selectedChip){ showToast('Vælg hvad det drejer sig om'); return; }
        const weightRaw = view.querySelector('#quickHealthWeight').value.trim();
        const weightKg = weightRaw ? parseFloat(weightRaw.replace(',','.')) : null;
        const note = view.querySelector('#quickHealthNote').value.trim();
        healthEntries.push({
          id: uid(), date, time, type: selectedChip.dataset.type,
          weightKg: (weightKg !== null && !isNaN(weightKg)) ? weightKg : null,
          note, createdAt: Date.now()
        });
        await saveHealth();
        showToast('Sundhedsnote gemt 🐾');
      } else {
        showToast('Vælg hvad du vil logge');
        return;
      }
      quickEntryOpen = false; quickEntryKind = null; quickLogSelected = []; quickEntryDate = null; quickEntryTime = null;
      renderToday();
    });
  }

  view.querySelectorAll('.tag-item').forEach(el => {
    el.addEventListener('click', async () => {
      const sid = el.dataset.session, exid = el.dataset.ex;
      const s = sessions.find(x=>x.id===sid);
      if(!s || s.completed) { if(s && s.completed) showToast('Træningen er allerede afsluttet'); return; }
      const idx = s.doneIds.indexOf(exid);
      if(idx>-1) s.doneIds.splice(idx,1); else s.doneIds.push(exid);
      await saveSessions();
      renderToday();
    });
  });
  view.querySelectorAll('[data-finish]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const sid = btn.dataset.finish;
      const s = sessions.find(x=>x.id===sid);
      if(!s) return;
      s.completed = true;
      s.completedAt = Date.now();
      await saveSessions();
      showToast('Træning afsluttet 🐾');
      renderToday();
    });
  });
  view.querySelectorAll('[data-save-notes]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const sid = btn.dataset.saveNotes;
      const s = sessions.find(x=>x.id===sid);
      const ta = view.querySelector(`[data-session-notes="${sid}"]`);
      s.notes = ta.value;
      await saveSessions();
      showToast('Note gemt');
    });
  });
}

/* ----- PLAN ----- */
function renderPlan(){
  const t = todayStr();
  const upcoming = sessions.filter(s => !s.completed).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const editing = planEditingId ? sessions.find(s=>s.id===planEditingId) : null;

  let html = storageNoteHtml();

  html += `<h2 class="section-title">${editing? 'Rediger træning' : 'Planlæg ny træning'}</h2>`;

  if(exercises.length === 0){
    html += `<div class="empty"><strong>Ingen øvelser endnu</strong>Tilføj øvelser under fanen Øvelser, så kan du vælge dem her.</div>`;
  } else {
    const selDate = editing ? editing.date : t;
    const selTime = editing ? editing.time : '16:00';
    const formKey = planEditingId || 'new';
    if(planFormInitializedFor !== formKey){
      planSelectedExerciseIds = editing ? [...editing.exerciseIds] : (pendingPlanExerciseId ? [pendingPlanExerciseId] : []);
      planFormInitializedFor = formKey;
    }
    pendingPlanExerciseId = null;
    html += `
      <div class="card">
        <label class="field-label">Dato</label>
        <input type="date" id="planDate" lang="da-DK" value="${selDate}">
        <label class="field-label">Tidspunkt</label>
        <input type="time" id="planTime" lang="da-DK" value="${selTime}">
        <div id="planDateTimePreview" style="font-size:12px;color:var(--ink-soft);margin:2px 0 12px;"></div>
        <label class="field-label">Øvelser</label>
        <input type="text" id="planExerciseSearch" placeholder="Søg efter øvelse...">
        <button class="cat-edit-btn" id="planToggleFilters" style="margin:6px 0; display:block;">${exercisePickerFiltersOpen? 'Skjul filtre ▴' : 'Filtrér øvelser ▾'}</button>
        <div id="planPickerFiltersWrap">${exercisePickerFiltersOpen ? pickerFilterChipsHtml('plan') : ''}</div>
        <div class="chip-select" id="planChips" style="margin-top:8px;">${exerciseChipOptionsHtml(exercisesForPicker(planSelectedExerciseIds), planSelectedExerciseIds)}</div>
        <div class="row-buttons">
          <button class="btn btn-primary" id="planSubmit">${editing? 'Opdater træning' : 'Planlæg træning'}</button>
          ${editing? '<button class="btn btn-ghost" id="planCancel">Annuller</button>' : ''}
        </div>
      </div>`;
  }

  html += `<h2 class="section-title">Kommende <span class="count">${upcoming.length}</span></h2>`;
  if(upcoming.length === 0){
    html += `<div class="empty">Ingen kommende træninger planlagt.</div>`;
  } else {
    upcoming.forEach(s => {
      const missed = s.date < t;
      const {dow, dm} = fmtDateShort(s.date);
      const names = s.exerciseIds.map(id => exerciseById(id)?.name).filter(Boolean).join(', ') || 'Ingen øvelser';
      html += `<div class="upcoming-row ${missed?'missed':''}" data-edit="${s.id}">
        <div class="date-block">${dow}<br>${dm.split(' ')[0]}</div>
        <div class="info">
          <div class="t">${s.time} ${missed? '· ikke gennemført':''}</div>
          <div class="ex">${escapeHtml(names)}</div>
        </div>
        <button data-delete-session="${s.id}" title="Slet" style="background:none;border:none;color:var(--ink-soft);cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>`;
    });
  }

  view.innerHTML = html;
  bindPlanEvents();
}

function applyPlanExerciseSearch(){
  const input = document.getElementById('planExerciseSearch');
  const chipsEl = document.getElementById('planChips');
  if(!input || !chipsEl) return;
  const term = input.value.trim().toLowerCase();
  chipsEl.querySelectorAll('.chip').forEach(chip=>{
    chip.style.display = (!term || chip.dataset.name.includes(term)) ? '' : 'none';
  });
}
function bindPlanChipClicks(){
  const chipsEl = document.getElementById('planChips');
  if(!chipsEl) return;
  chipsEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const id = chip.dataset.id;
      const idx = planSelectedExerciseIds.indexOf(id);
      if(idx>-1) planSelectedExerciseIds.splice(idx,1); else planSelectedExerciseIds.push(id);
      chip.classList.toggle('selected');
    });
  });
}
function bindPlanPickerFilterChips(){
  const wrap = document.getElementById('planPickerFiltersWrap');
  if(!wrap) return;
  wrap.querySelectorAll('#planCatFilterChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ libraryCategoryFilter = chip.dataset.filterCat === '__all__' ? null : chip.dataset.filterCat; refreshPlanChipsUI(); });
  });
  wrap.querySelectorAll('#planForloebFilterChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ libForloebFilter = chip.dataset.filterForloeb === '__all__' ? null : chip.dataset.filterForloeb; refreshPlanChipsUI(); });
  });
  wrap.querySelectorAll('#planDifficultyFilterChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ libDifficultyFilter = chip.dataset.filterDifficulty === '__all__' ? null : chip.dataset.filterDifficulty; refreshPlanChipsUI(); });
  });
  wrap.querySelectorAll('#planRewardFilterChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ libRewardFilter = chip.dataset.filterReward === '__all__' ? null : chip.dataset.filterReward; refreshPlanChipsUI(); });
  });
}
function refreshPlanChipsUI(){
  const chipsEl = document.getElementById('planChips');
  if(chipsEl) chipsEl.innerHTML = exerciseChipOptionsHtml(exercisesForPicker(planSelectedExerciseIds), planSelectedExerciseIds);
  const filtersWrap = document.getElementById('planPickerFiltersWrap');
  if(filtersWrap) filtersWrap.innerHTML = exercisePickerFiltersOpen ? pickerFilterChipsHtml('plan') : '';
  const toggleBtn = document.getElementById('planToggleFilters');
  if(toggleBtn) toggleBtn.textContent = exercisePickerFiltersOpen ? 'Skjul filtre ▴' : 'Filtrér øvelser ▾';
  bindPlanChipClicks();
  bindPlanPickerFilterChips();
  applyPlanExerciseSearch();
}
function bindPlanEvents(){
  const dateInput = view.querySelector('#planDate');
  const timeInput = view.querySelector('#planTime');
  const preview = view.querySelector('#planDateTimePreview');
  const updatePreview = () => {
    if(!preview || !dateInput || !timeInput) return;
    const dateVal = dateInput.value, timeVal = timeInput.value;
    preview.textContent = (dateVal && timeVal)
      ? `Valgt: ${formatDDMMYYYY(dateVal)} kl. ${timeVal}`
      : '';
  };
  if(dateInput){ dateInput.addEventListener('input', updatePreview); }
  if(timeInput){ timeInput.addEventListener('input', updatePreview); }
  updatePreview();

  bindPlanChipClicks();
  bindPlanPickerFilterChips();
  applyPlanExerciseSearch();
  const planExerciseSearch = view.querySelector('#planExerciseSearch');
  if(planExerciseSearch){
    planExerciseSearch.addEventListener('input', applyPlanExerciseSearch);
  }
  const planToggleFilters = view.querySelector('#planToggleFilters');
  if(planToggleFilters){
    planToggleFilters.addEventListener('click', ()=>{
      exercisePickerFiltersOpen = !exercisePickerFiltersOpen;
      refreshPlanChipsUI();
    });
  }
  const submit = view.querySelector('#planSubmit');
  if(submit){
    submit.addEventListener('click', async ()=>{
      const date = view.querySelector('#planDate').value;
      const time = view.querySelector('#planTime').value;
      const selectedIds = [...planSelectedExerciseIds];
      if(!date || !time){ showToast('Vælg dato og tidspunkt'); return; }
      if(selectedIds.length === 0){ showToast('Vælg mindst én øvelse'); return; }

      if(planEditingId){
        const s = sessions.find(x=>x.id===planEditingId);
        s.date = date; s.time = time; s.exerciseIds = selectedIds;
        s.doneIds = s.doneIds.filter(id => selectedIds.includes(id));
        showToast('Træning opdateret');
        planEditingId = null;
      } else {
        sessions.push({ id: uid(), date, time, exerciseIds: selectedIds, doneIds: [], completed:false, notes:'', completedAt:null });
        showToast('Træning planlagt 📅');
      }
      await saveSessions();
      planFormInitializedFor = undefined;
      renderPlan();
    });
  }
  const cancel = view.querySelector('#planCancel');
  if(cancel){ cancel.addEventListener('click', ()=>{ planEditingId=null; planFormInitializedFor = undefined; renderPlan(); }); }

  view.querySelectorAll('[data-edit]').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('[data-delete-session]')) return;
      planEditingId = row.dataset.edit;
      renderPlan();
      view.scrollTo({top:0, behavior:'smooth'});
    });
  });
  view.querySelectorAll('[data-delete-session]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.deleteSession;
      if(!confirm('Slet denne planlagte træning?')) return;
      sessions = sessions.filter(s=>s.id!==id);
      if(planEditingId===id) planEditingId = null;
      await saveSessions();
      renderPlan();
    });
  });
}

function exercisesForPicker(includeIds){
  includeIds = includeIds || [];
  return exercises.filter(ex => {
    if(includeIds.includes(ex.id)) return true; // always keep already-selected exercises visible, even if filtered out
    if(ex.archived) return false;
    const matchesCat = !libraryCategoryFilter || (ex.categories||[]).includes(libraryCategoryFilter);
    const matchesForloeb = !libForloebFilter || ex.forloeb === libForloebFilter;
    const matchesDifficulty = !libDifficultyFilter || String(ex.difficulty) === String(libDifficultyFilter);
    const matchesReward = !libRewardFilter || (ex.rewardTypes||[]).includes(libRewardFilter);
    return matchesCat && matchesForloeb && matchesDifficulty && matchesReward;
  });
}

function pickRandomExercise(){
  const term = librarySearch.trim().toLowerCase();
  const activeExercises = exercises.filter(ex => !ex.archived);
  const pool = activeExercises.filter(ex=>{
    const matchesTerm = !term || ex.name.toLowerCase().includes(term);
    const matchesCat = !libraryCategoryFilter || (ex.categories||[]).includes(libraryCategoryFilter);
    const matchesReward = !libRewardFilter || (ex.rewardTypes||[]).includes(libRewardFilter);
    const matchesDifficulty = !libDifficultyFilter || String(ex.difficulty) === String(libDifficultyFilter);
    const matchesForloeb = !libForloebFilter || ex.forloeb === libForloebFilter;
    return matchesTerm && matchesCat && matchesReward && matchesDifficulty && matchesForloeb;
  });
  const source = pool.length ? pool : activeExercises; // fall back to all active (non-hidden) exercises if the current filter matches nothing
  if(source.length === 0){ randomExerciseId = null; return; }
  let candidates = source;
  if(source.length > 1 && randomExerciseId){
    candidates = source.filter(ex => ex.id !== randomExerciseId); // avoid repeating the same pick twice in a row
    if(candidates.length === 0) candidates = source;
  }
  randomExerciseId = candidates[Math.floor(Math.random()*candidates.length)].id;
}

  const cats = ex.categories || [];
  const isEditingCats = libEditingCatsId === ex.id;
  const catsSection = isEditingCats
    ? `<div style="margin-top:8px;">
         ${categoryPickerHtml('editCatChips-'+ex.id, cats)}
         <div class="row-buttons" style="margin-top:8px;">
           <button class="btn btn-primary btn-small" data-save-cats="${ex.id}">Gem temaer</button>
           <button class="btn btn-ghost btn-small" data-cancel-cats="${ex.id}">Annuller</button>

         <input type="text" id="editNameText-${ex.id}" value="${escapeHtml(ex.name)}">

  const isDetailsOpen = libDetailsOpenId === ex.id;
  const lastTrained = lastTrainedDate(ex.id);
  const detailsSection = isDetailsOpen
    ? `<div style="margin-top:10px;padding:12px;border-radius:12px;background:var(--paper);border:1px solid var(--card-line);">
         <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">

    </button>

}

function renderLibResults(){
  const container = document.getElementById('libResultsList');
  if(!container) return;
  const term = librarySearch.trim().toLowerCase();
  const filtered = favSort(exercises.filter(ex=>{
    const matchesTerm = !term || ex.name.toLowerCase().includes(term);
    const matchesCat = !libraryCategoryFilter || (ex.categories||[]).includes(libraryCategoryFilter);
    const matchesArchived = showArchivedExercises || !ex.archived;
    const matchesReward = !libRewardFilter || (ex.rewardTypes||[]).includes(libRewardFilter);
    const matchesDifficulty = !libDifficultyFilter || String(ex.difficulty) === String(libDifficultyFilter);
    const matchesForloeb = !libForloebFilter || ex.forloeb === libForloebFilter;
    return matchesTerm && matchesCat && matchesArchived && matchesReward && matchesDifficulty && matchesForloeb;
  }));

  let html = `<h2 class="section-title">Dine øvelser <span class="count">${filtered.length}</span></h2>`;
  if(exercises.length === 0){
    html += `<div class="empty"><strong>Biblioteket er tomt</strong>Tilføj den første øvelse ovenfor, så kan du bruge den i din planlægning.</div>`;
  } else if(filtered.length === 0){
    html += `<div class="empty"><strong>Ingen øvelser matcher</strong>Prøv en anden søgning, eller vælg "Alle" for at se hele biblioteket.</div>`;
  } else {
    filtered.forEach(ex=>{ html += renderLibItem(ex); });
  }
  container.innerHTML = html;
  bindLibResultsEvents(container);
}

function bindLibraryEvents(){
  const rollBtn = view.querySelector('#rollRandomExercise');
  if(rollBtn){
    rollBtn.addEventListener('click', ()=>{
      pickRandomExercise();
      renderLibrary();
    });
  }
  const useRandomBtn = view.querySelector('#useRandomExercise');
  if(useRandomBtn){
    useRandomBtn.addEventListener('click', ()=>{
      pendingPlanExerciseId = useRandomBtn.dataset.id;
      switchTab('plan');
      showToast('Øvelse valgt – vælg dato og tidspunkt');
    });
  }

  const addForm = view.querySelector('#libAddForm');
  bindCategoryPickerEvents(addForm);

  addForm.querySelector('#libAdd').addEventListener('click', async ()=>{
    const nameEl = view.querySelector('#libName');
    const noteEl = view.querySelector('#libNote');
    const name = nameEl.value.trim();
    if(!name){ showToast('Skriv et navn på øvelsen'); return; }
    const categories = Array.from(view.querySelectorAll('#newCatChips .chip.selected')).map(c=>c.dataset.cat);
    exercises.push({
      id: uid(), name, note: noteEl.value.trim(), image: newExercisePhoto || null, categories,
      favorite: false, archived: false,
      forloeb: null, difficulty: null, rewardTypes: [], status: null, priority: null
    });
    newExercisePhoto = null;
    await saveExercises();
    showToast('Øvelse tilføjet');
    renderLibrary();
  });

  const newPhotoInput = view.querySelector('#libNewPhotoInput');
  const newPhotoPick = view.querySelector('#libNewPhotoPick');
  if(newPhotoPick){ newPhotoPick.addEventListener('click', ()=> newPhotoInput.click()); }
  const newPhotoRemove = view.querySelector('#libNewPhotoRemove');
  if(newPhotoRemove){ newPhotoRemove.addEventListener('click', ()=>{ newExercisePhoto = null; renderLibrary(); }); }
  newPhotoInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{ newExercisePhoto = await resizeImageFile(file); renderLibrary(); }
    catch(err){ showToast('Kunne ikke læse billedet'); }
  });

  const searchInput = view.querySelector('#libSearchInput');
  if(searchInput){
    searchInput.value = librarySearch;
    searchInput.addEventListener('input', ()=>{ librarySearch = searchInput.value; renderLibResults(); });
  }
  const filterChips = view.querySelector('#libCatFilterChips');
  if(filterChips){
    filterChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        libraryCategoryFilter = chip.dataset.filterCat === '__all__' ? null : chip.dataset.filterCat;
        filterChips.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        renderLibResults();
      });
    });
  }

  const toggleManageCats = view.querySelector('#toggleManageCats');
  if(toggleManageCats){
    toggleManageCats.addEventListener('click', ()=>{
      manageCategoriesOpen = !manageCategoriesOpen;
      renderLibrary();
    });
  }
  const showArchivedToggle = view.querySelector('#showArchivedToggle');
  if(showArchivedToggle){
    showArchivedToggle.addEventListener('change', ()=>{
      showArchivedExercises = showArchivedToggle.checked;
      renderLibResults();
    });
  }
  const forloebFilterChips = view.querySelector('#libForloebFilterChips');
  if(forloebFilterChips){
    forloebFilterChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        libForloebFilter = chip.dataset.filterForloeb === '__all__' ? null : chip.dataset.filterForloeb;
        forloebFilterChips.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        renderLibResults();
      });
    });
  }
  const rewardFilterChips = view.querySelector('#libRewardFilterChips');
  if(rewardFilterChips){
    rewardFilterChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        libRewardFilter = chip.dataset.filterReward === '__all__' ? null : chip.dataset.filterReward;
        rewardFilterChips.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        renderLibResults();
      });
    });
  }
  const difficultyFilterChips = view.querySelector('#libDifficultyFilterChips');
  if(difficultyFilterChips){
    difficultyFilterChips.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        libDifficultyFilter = chip.dataset.filterDifficulty === '__all__' ? null : chip.dataset.filterDifficulty;
        difficultyFilterChips.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        renderLibResults();
      });
    });
  }
  const toggleManageForloeb = view.querySelector('#toggleManageForloeb');
  if(toggleManageForloeb){
    toggleManageForloeb.addEventListener('click', ()=>{
      manageForloebOpen = !manageForloebOpen;
      renamingForloebName = null;
      renderLibrary();
    });
  }
  const toggleManageRewards = view.querySelector('#toggleManageRewards');
  if(toggleManageRewards){
    toggleManageRewards.addEventListener('click', ()=>{
      manageRewardsOpen = !manageRewardsOpen;
      renderLibrary();
    });
  }
  view.querySelectorAll('[data-delete-reward]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name = btn.dataset.deleteReward;
      if(!confirm(`Slet belønningstypen "${name}"? Den fjernes fra alle øvelser og forsvinder som forslag.`)) return;
      await deleteRewardType(name);
      showToast('Belønningstype slettet');
      renderLibrary();
    });
  });
  view.querySelectorAll('[data-rename-forloeb]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      renamingForloebName = btn.dataset.renameForloeb;
      renderLibrary();
    });
  });
  view.querySelectorAll('[data-cancel-rename-forloeb]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      renamingForloebName = null;
      renderLibrary();
    });
  });
  view.querySelectorAll('[data-save-rename-forloeb]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const oldName = btn.dataset.saveRenameForloeb;
      const input = document.getElementById('renameForloebInput');
      const newName = input ? input.value.trim() : '';
      if(!newName){ showToast('Navnet må ikke være tomt'); return; }
      if(newName !== oldName){
        exercises.forEach(ex=>{ if(ex.forloeb === oldName) ex.forloeb = newName; });
        await saveExercises();
        if(libForloebFilter === oldName) libForloebFilter = newName;
        showToast('Forløb omdøbt');
      }
      renamingForloebName = null;
      renderLibrary();
    });
  });
  view.querySelectorAll('[data-delete-forloeb]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name = btn.dataset.deleteForloeb;
      if(!confirm(`Fjern forløbet "${name}" fra alle øvelser? Selve øvelserne slettes ikke.`)) return;
      exercises.forEach(ex=>{ if(ex.forloeb === name) ex.forloeb = null; });
      await saveExercises();
      if(libForloebFilter === name) libForloebFilter = null;
      showToast('Forløb fjernet');
      renderLibrary();
    });
  });
  view.querySelectorAll('[data-delete-category]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name = btn.dataset.deleteCategory;
      if(!confirm(`Slet temaet "${name}"? Det fjernes fra alle øvelser og forsvinder som forslag.`)) return;
      await deleteCategory(name);
      showToast('Tema slettet');
      renderLibrary();
    });
  });
}

function bindLibResultsEvents(container){
  bindCategoryPickerEvents(container);
  bindActivityTypePickerEvents(container); // handles the single-select Forløb/Sværhedsgrad/Status/Prioritet pickers

  container.querySelectorAll('[data-toggle-details]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      libDetailsOpenId = (libDetailsOpenId === btn.dataset.toggleDetails) ? null : btn.dataset.toggleDetails;
      renderLibResults();
    });
  });
  container.querySelectorAll('[data-cancel-details]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ libDetailsOpenId = null; renderLibResults(); });
  });
  container.querySelectorAll('[data-save-details]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveDetails;
      const ex = exerciseById(id);
      if(ex){
        const forloebChip = document.querySelector(`#editForloeb-${id} .chip.selected`);
        const difficultyChip = document.querySelector(`#editDifficulty-${id} .chip.selected`);
        const statusChip = document.querySelector(`#editStatus-${id} .chip.selected`);
        const priorityChip = document.querySelector(`#editPriority-${id} .chip.selected`);
        const rewardChips = document.querySelectorAll(`#editRewards-${id} .chip.selected`);
        ex.forloeb = forloebChip ? forloebChip.dataset.type : null;
        ex.difficulty = difficultyChip ? parseInt(difficultyChip.dataset.type, 10) : null;
        ex.status = statusChip ? statusChip.dataset.type : null;
        ex.priority = priorityChip ? priorityChip.dataset.type : null;
        ex.rewardTypes = Array.from(rewardChips).map(c => c.dataset.cat);
        await saveExercises();
        showToast('Detaljer gemt');
      }
      libDetailsOpenId = null;
      renderLibResults();
    });
  });

  container.querySelectorAll('[data-toggle-fav]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ex = exerciseById(btn.dataset.toggleFav);
      if(ex){ ex.favorite = !ex.favorite; await saveExercises(); renderLibResults(); }
    });
  });

  container.querySelectorAll('[data-toggle-archive]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const ex = exerciseById(btn.dataset.toggleArchive);
      if(ex){
        ex.archived = !ex.archived;
        await saveExercises();
        showToast(ex.archived ? 'Øvelse skjult' : 'Øvelse vist igen');
        renderLibResults();
      }
    });
  });

  container.querySelectorAll('[data-edit-name]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      libEditingNameId = btn.dataset.editName;
      renderLibResults();
      const input = document.getElementById('editNameText-'+btn.dataset.editName);
      if(input){
        input.focus();
        input.select();
        input.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){ document.querySelector(`[data-save-name="${btn.dataset.editName}"]`).click(); }
          if(e.key === 'Escape'){ document.querySelector(`[data-cancel-name="${btn.dataset.editName}"]`).click(); }
        });
      }
    });
  });
  container.querySelectorAll('[data-cancel-name]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      libEditingNameId = null;
      renderLibResults();
    });
  });
  container.querySelectorAll('[data-save-name]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveName;
      const input = document.getElementById('editNameText-'+id);
      const newName = input ? input.value.trim() : '';
      if(!newName){ showToast('Navnet må ikke være tomt'); return; }
      const ex = exerciseById(id);
      if(ex){
        ex.name = newName;
        await saveExercises();
        showToast('Navn opdateret');
      }
      libEditingNameId = null;
      renderLibResults();
    });
  });

  container.querySelectorAll('[data-edit-note]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      libEditingNoteId = btn.dataset.editNote;
      renderLibResults();
    });
  });
  container.querySelectorAll('[data-cancel-note]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      libEditingNoteId = null;
      renderLibResults();
    });
  });
  container.querySelectorAll('[data-save-note]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveNote;
      const ta = document.getElementById('editNoteText-'+id);
      const ex = exerciseById(id);
      if(ex && ta){
        ex.note = ta.value.trim();
        await saveExercises();
        showToast('Note gemt');
      }
      libEditingNoteId = null;
      renderLibResults();
    });
  });

  const hiddenInput = view.querySelector('#libPhotoInputHidden');
  container.querySelectorAll('[data-add-photo], [data-change-photo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      photoTargetExerciseId = el.dataset.addPhoto || el.dataset.changePhoto;
      hiddenInput.click();
    });
  });
  hiddenInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file || !photoTargetExerciseId) return;
    try{
      const dataUrl = await resizeImageFile(file);
      const ex = exerciseById(photoTargetExerciseId);
      if(ex){ ex.image = dataUrl; await saveExercises(); showToast('Billede gemt'); renderLibResults(); }
    } catch(err){ showToast('Kunne ikke læse billedet'); }
    hiddenInput.value = '';
    photoTargetExerciseId = null;
  };
  container.querySelectorAll('[data-remove-photo]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ex = exerciseById(btn.dataset.removePhoto);
      if(ex){ ex.image = null; await saveExercises(); renderLibResults(); }
    });
  });

  container.querySelectorAll('[data-toggle-cats]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      libEditingCatsId = btn.dataset.toggleCats;
      renderLibResults();
    });
  });
  container.querySelectorAll('[data-cancel-cats]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ libEditingCatsId = null; renderLibResults(); });
  });
  container.querySelectorAll('[data-save-cats]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveCats;
      const ex = exerciseById(id);
      const picker = document.getElementById('editCatChips-'+id);
      if(ex && picker){
        ex.categories = Array.from(picker.querySelectorAll('.chip.selected')).map(c=>c.dataset.cat);
        await saveExercises();
        showToast('Temaer gemt');
      }
      libEditingCatsId = null;
      renderLibResults();
    });
  });

  container.querySelectorAll('[data-del-ex]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.delEx;
      if(!confirm('Slet denne øvelse? Den fjernes også fra planlagte træninger.')) return;
      exercises = exercises.filter(e=>e.id!==id);
      sessions.forEach(s=>{
        s.exerciseIds = s.exerciseIds.filter(x=>x!==id);
        s.doneIds = s.doneIds.filter(x=>x!==id);
      });
      await saveExercises();
      await saveSessions();
      renderLibResults();
    });
  });
}

function renderLog(){

  if(totalEntries > 0){
    html += `<div class="chip-select" id="logTypeFilterChips">

      <div class="chip ${logTypeFilter==='diary'?'selected':''}" data-type-filter="diary">Dagbog</div>
      <div class="chip ${logTypeFilter==='health'?'selected':''}" data-type-filter="health">Sundhed</div>

  if(logTypeFilter==='all' || logTypeFilter==='activity') chartEvents.push(...activities);
  if(logTypeFilter==='all' || logTypeFilter==='diary') chartEvents.push(...diaryEntries);

    html += `<div class="chip-select" id="periodChips">
      <div class="chip ${logPeriod==='week'?'selected':''}" data-period="week">Seneste uge</div>
      <div class="chip ${logPeriod==='month'?'selected':''}" data-period="month">Denne måned</div>
      <div class="chip ${logPeriod==='year'?'selected':''}" data-period="year">Seneste år</div>
    </div>`;
    html += renderLogChart(chartEvents, logTypeFilter);

  html += `<h2 class="section-title" style="margin-top:22px;">${typeLabel} <span class="count" id="logEntryCount"></span></h2>`;

  }

  html += `<div class="card" style="margin-top:22px;">
    <label class="field-label">Backup</label>

      <button class="btn btn-ghost" id="importDataBtn">Importér data</button>
    </div>
    <input type="file" accept="application/json" id="importDataInput" style="display:none;">
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Gem en fil med alt dit data – godt til en ny telefon eller som sikkerhedskopi.</div>
  </div>`;

  view.innerHTML = html;
  renderLogEntries();

function renderLogEntries(){
  const list = document.getElementById('logEntriesList');
  const countEl = document.getElementById('logEntryCount');
  if(!list) return;
  const done = sessions.filter(s=>s.completed);
  const totalEntries = done.length + activities.length + diaryEntries.length + healthEntries.length;
  const entryTs = (date, time) => {
    const t = new Date(`${date}T${time || '00:00'}`).getTime();
    return isNaN(t) ? 0 : t;
  };

  let combined = [];
  if(logTypeFilter==='all' || logTypeFilter==='training'){
    combined = combined.concat(done.map(s => ({ kind:'training', ts: entryTs(s.date, s.time), data:s })));
  }
  if(logTypeFilter==='all' || logTypeFilter==='activity'){
    combined = combined.concat(activities.map(a => ({ kind:'activity', ts: entryTs(a.date, a.time), data:a })));
  }
  if(logTypeFilter==='all' || logTypeFilter==='diary'){
    combined = combined.concat(diaryEntries.map(d => ({ kind:'diary', ts: entryTs(d.date, d.time), data:d })));
  }
  if(logTypeFilter==='all' || logTypeFilter==='health'){
    combined = combined.concat(healthEntries.map(h => ({ kind:'health', ts: entryTs(h.date, h.time), data:h })));
  }

  const term = logSearchTerm.trim().toLowerCase();
  if(term){
    combined = combined.filter(entry=>{
      if(entry.kind==='training'){
        const s = entry.data;
        const names = s.doneIds.map(id=>exerciseById(id)?.name).filter(Boolean).join(' ');
        return (s.notes||'').toLowerCase().includes(term) || names.toLowerCase().includes(term);
      }
      if(entry.kind==='activity'){
        const a = entry.data;
        return (a.note||'').toLowerCase().includes(term) || (a.type||'').toLowerCase().includes(term);
      }
      if(entry.kind==='diary'){
        return (entry.data.text||'').toLowerCase().includes(term);
      }
      if(entry.kind==='health'){
        const h = entry.data;
        return (h.note||'').toLowerCase().includes(term) || (h.type||'').toLowerCase().includes(term);
      }
      return false;
    });
  }

  combined.sort((a,b)=> b.ts - a.ts);
  if(countEl) countEl.textContent = combined.length;

  let html = '';
  if(totalEntries === 0){
    html = `<div class="empty">Endnu ingen at vise her.</div>`;
  } else if(combined.length === 0){
    html = `<div class="empty">Intet matcher dette filter eller søgning.</div>`;
  } else {
    combined.forEach(entry=>{
      const isEditing = editingLogEntry && editingLogEntry.kind === entry.kind && editingLogEntry.id === entry.data.id;
      html += isEditing ? renderEntryEditForm(entry) : renderEntryView(entry);
    });
  }
  list.innerHTML = html;
  bindLogEntryEvents(list);
}
